services:
  - type: web
    name: compliance-map
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TINYFISH_API_KEY
        sync: false
      - key: COMPLIANCE_ACCESS_TOKEN
        sync: false
